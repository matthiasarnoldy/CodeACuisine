<app-header></app-header>
<section class="generate__recipe">
    <h2>Generate recipe</h2>
    <div class="generate__recipe--content">
        <h6>Got random stuff in your kitchen? Pop it in—we’ve got the perfect recipe waiting.</h6>
        <section class="ingredient__cards">
            <form class="ingredient__card ingredient__card--add">
                <fieldset>
                    <label for="ingredient">Ingredient</label>
                    <input class="input__ingredient input__ingredient--search" type="text" id="ingredient" name="ingredient" maxlength="38">
                </fieldset>
                <fieldset>
                    <label for="serving">Serving size</label>
                    <div class="ingredient__card--serving">
                        <input class="input__ingredient input__ingredient--size" type="text" id="serving" name="serving" placeholder="100" maxlength="4">
                        <select class="input__ingredient input__ingredient--dropdown" id="unit" name="unit">
                            <option value="gram" selected>gram</option>
                            <option value="ml">ml</option>
                            <option value="pieces">piece(s)</option>
                            </select>
                        <button class="button button__add--green button__add--bgCream"></button>
                    </div>
                </fieldset>
            </form>
            <div class="ingredient__card">
                <p>List of your Ingredients</p>
                <ul class="ingredient__list">
                    <li>
                        <div class="ingredient__row">
                            <span class="ingredient__amount">100g</span>
                            <span>Pasta</span>
                            <span class="ingredient__actions">
                                <button class="button button__edit--green button__edit--bgGreen"></button>
                                <button class="button button__delete--green button__delete--bgGreen"></button>
                            </span>
                        </div>
                    </li>
                    <li>
                        <div class="ingredient__row">
                            <span class="ingredient__amount">150g</span>
                            <span>Cherry tomatoes</span>
                            <span class="ingredient__actions">
                                <button class="button button__edit--green button__edit--bgGreen"></button>
                                <button class="button button__delete--green button__delete--bgGreen"></button>
                            </span>
                        </div>
                    </li>
                </ul>
            </div>
        </section>
        <button class="button button--primary button--primaryGreen button__next" routerLink="/preferences-recipe">Next Step</button>
    </div>
</section>
